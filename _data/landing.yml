fr:
  eyebrow: "L'IA privée pour les PME"
  headline: "Votre assistant IA privé, adapté à votre entreprise."
  subtitle: "Interrogez vos documents, préparez vos contenus et simplifiez le travail de vos équipes. Dans vos locaux, en France chez Scaleway ou en Suisse chez Infomaniak : choisissez le déploiement adapté à vos exigences, avec un accompagnement défini selon votre projet."
  explore: "Découvrir les usages"
  pillars:
    - title: "Utile à vos équipes"
      text: "Un assistant pour vos documents, vos questions et vos contenus du quotidien."
    - title: "Déployé selon vos exigences"
      text: "Dans vos locaux, dans le cloud français ou dans le cloud suisse."
    - title: "Accompagné selon vos besoins"
      text: "Des prestations possibles, définies avec vous selon votre projet."
  uses_title: "Une IA au service du travail de vos équipes"
  uses:
    - title: "Questionnez vos documents"
      text: "Retrouvez ce que disent vos procédures, votre documentation ou vos dossiers à partir des contenus mis à disposition de l'assistant."
    - title: "Préparez vos contenus"
      text: "Travaillez sur une synthèse de dossier, un premier brouillon ou un compte rendu à partir de vos informations métier."
    - title: "Travaillez avec vos outils"
      text: "Les connexions aux outils métier sont étudiées selon les intégrations disponibles et le périmètre convenu."
  ai_notice: "Les contenus produits par l'IA doivent être vérifiés avant utilisation."
  deployments_title: "Trois façons de déployer votre assistant"
  deployments:
    - id: on_site
      title: "Dans vos locaux en France"
      text: "Nosia se déploie directement sur site, chez le client en France, sur du matériel avec superpuce GB10. Le dimensionnement et les conditions d'exploitation sont cadrés pour votre projet."
    - id: scaleway
      title: "En France chez Scaleway"
      text: "Documents et inférence sont hébergés en France chez Scaleway, société de droit français, sans transmettre le contenu à une API d'IA externe."
    - id: infomaniak
      title: "En Suisse chez Infomaniak"
      text: "Documents et inférence sont hébergés en Suisse chez Infomaniak, société de droit suisse. Une alternative distincte de l'hébergement français."
  support_title: "Un accompagnement défini ensemble"
  support_intro: "Un service clé en main est possible. Nous définissons avec vous les prestations adaptées à votre déploiement et à vos équipes."
  support_steps:
    - title: "Cadrer les usages"
      text: "Identifier les tâches utiles, les contenus et les exigences de confidentialité."
    - title: "Choisir le déploiement"
      text: "Évaluer les options sur site, en France ou en Suisse selon votre projet."
    - title: "Mettre en service et accompagner"
      text: "Organiser la mise en service et l'accompagnement selon le périmètre convenu."
  support_note: "Installation, maintenance, mises à jour, support et accompagnement des équipes sur leurs usages métier : ces prestations sont possibles, mais ne sont pas systématiquement incluses."
  trust_title: "Une confiance fondée sur des choix explicites"
  trust_intro: "Le socle Nosia est open source : son code est consultable. Pour votre projet, nous cadrons le lieu de traitement des données, les accès et les éventuelles connexions à vos outils."
  developer_note: "Le socle Nosia propose une API compatible OpenAI, de la recherche documentaire (RAG) et des connexions via MCP. Leur mise en œuvre dans votre projet dépend du périmètre retenu."
  resource_label: "Comprendre le socle Nosia"
  faq_title: "Vos questions avant de démarrer"
  faq:
    - question: "En quoi Nosia diffère-t-il d'un assistant grand public ?"
      answer: "Le projet part des usages de votre entreprise et des contenus que vous choisissez de mettre à disposition de l'assistant. Vous choisissez le mode de déploiement, et le périmètre de service est défini avec vous."
    - question: "Où sont traitées mes données ?"
      answer: "Le déploiement peut être réalisé sur site chez le client en France, dans le cloud français chez Scaleway ou dans le cloud suisse chez Infomaniak. Les accès, sauvegardes et éventuelles connexions doivent être cadrés selon le projet ; la localisation seule ne décrit pas tous les flux."
    - question: "Dois-je disposer de matériel ou d'une équipe technique ?"
      answer: "L'option sur site utilise du matériel avec superpuce GB10. Les options cloud proposent un autre mode de déploiement. Le dimensionnement et les responsabilités techniques sont précisés ensemble ; un accompagnement est possible."
    - question: "Quelles prestations sont comprises ?"
      answer: "Installation, maintenance, mises à jour, support et accompagnement métier sont des prestations possibles. Leur inclusion et leur périmètre sont définis pour votre projet, pas présumés identiques pour tous les déploiements."
    - question: "Comment choisir le déploiement et connaître le budget ?"
      answer: "Nous partons de vos usages, de vos contenus, de vos exigences de confidentialité et du niveau d'accompagnement souhaité. Ces éléments permettent de cadrer le déploiement et le budget de votre projet."
    - question: "Puis-je utiliser les réponses sans les vérifier ?"
      answer: "Non. L'IA peut produire des erreurs. Les réponses et contenus doivent être relus et vérifiés avant utilisation, même lorsqu'ils s'appuient sur vos documents."
  contact_title: "Parlons de votre projet"
  contact_intro: "Décrivez vos usages, vos contraintes et vos attentes. Nous pourrons cadrer le déploiement et l'accompagnement adaptés à votre entreprise."
  footer_description: "Votre assistant IA privé, adapté à votre entreprise."
  footer_project: "Le projet Nosia"
  footer_code: "Code source"
en:
  eyebrow: "Private AI for SMEs"
  headline: "Your private AI assistant, tailored to your business."
  subtitle: "Ask questions about your documents, prepare content and simplify your team's day-to-day work. On your premises, in France with Scaleway or in Switzerland with Infomaniak: choose the deployment that fits your requirements, with support scoped to your project."
  explore: "Explore use cases"
  pillars:
    - title: "Useful to your team"
      text: "An assistant for your documents, questions and day-to-day content."
    - title: "Deployed to fit your requirements"
      text: "On your premises, in the French cloud or in the Swiss cloud."
    - title: "Support tailored to your needs"
      text: "Available services, scoped with you for your project."
  uses_title: "AI for your team's day-to-day work"
  uses:
    - title: "Ask questions about your documents"
      text: "Explore what your procedures, documentation or files say using the content made available to the assistant."
    - title: "Prepare your content"
      text: "Work on a file summary, a first draft or meeting notes using your business information."
    - title: "Work with your tools"
      text: "Connections to business tools are assessed according to available integrations and the agreed scope."
  ai_notice: "AI-generated content must be checked before use."
  deployments_title: "Three ways to deploy your assistant"
  deployments:
    - id: on_site
      title: "On your premises in France"
      text: "Nosia can be deployed directly on the client's premises in France, on hardware with a GB10 superchip. Sizing and operating conditions are scoped for your project."
    - id: scaleway
      title: "In France with Scaleway"
      text: "Documents and inference are hosted in France with Scaleway, a company governed by French law, without sending content to an external AI API."
    - id: infomaniak
      title: "In Switzerland with Infomaniak"
      text: "Documents and inference are hosted in Switzerland with Infomaniak, a company governed by Swiss law. A distinct alternative to French hosting."
  support_title: "Support scoped together"
  support_intro: "A turnkey service is possible. We define the services that fit your deployment and your team with you."
  support_steps:
    - title: "Define the use cases"
      text: "Identify useful tasks, content and confidentiality requirements."
    - title: "Choose the deployment"
      text: "Assess on-site, French and Swiss options for your project."
    - title: "Set up and support adoption"
      text: "Organise setup and team support according to the agreed scope."
  support_note: "Installation, maintenance, updates, support and help with your team's business use cases are available services, not automatically included in every deployment."
  trust_title: "Trust built on explicit choices"
  trust_intro: "The Nosia software foundation is open source: its code can be inspected. For your project, we scope where data is processed, access and any connections to your tools."
  developer_note: "The Nosia foundation offers an OpenAI-compatible API, document retrieval (RAG) and connections through MCP. Their implementation in your project depends on the agreed scope."
  resource_label: "Understand the Nosia foundation"
  faq_title: "Your questions before getting started"
  faq:
    - question: "How does Nosia differ from a consumer assistant?"
      answer: "The project starts with your business use cases and the content you choose to make available to the assistant. You choose the deployment, and the service scope is defined with you."
    - question: "Where is my data processed?"
      answer: "Deployment can take place on the client's premises in France, in the French cloud with Scaleway or in the Swiss cloud with Infomaniak. Access, backups and any connections must be scoped for your project; location alone does not describe every data flow."
    - question: "Do I need hardware or a technical team?"
      answer: "The on-site option uses hardware with a GB10 superchip. Cloud options provide a different deployment approach. Sizing and technical responsibilities are defined together; support is available."
    - question: "Which services are included?"
      answer: "Installation, maintenance, updates, support and help with business use cases are available services. Their inclusion and scope are defined for your project, not assumed to be identical across deployments."
    - question: "How do I choose a deployment and find out the budget?"
      answer: "We start with your use cases, content, confidentiality requirements and desired level of support. These inputs allow us to scope the deployment and budget for your project."
    - question: "Can I use answers without checking them?"
      answer: "No. AI can make mistakes. Answers and content must be reviewed and checked before use, even when they draw on your documents."
  contact_title: "Let's discuss your project"
  contact_intro: "Tell us about your use cases, constraints and expectations. We can scope the deployment and support that fit your business."
  footer_description: "Your private AI assistant, tailored to your business."
  footer_project: "The Nosia project"
  footer_code: "Source code"
